name: mo-money wallet forensics

on:
  push:
    branches:
      - research/run-mo-money-forensics
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API client
        run: python -m pip install --disable-pip-version-check aiohttp
      - name: Analyze public Polymarket wallet history
        run: python scripts/analyze_target_wallet.py --out-dir artifacts/mo_money --verbose
      - name: Upload concise analysis
        uses: actions/upload-artifact@v4
        with:
          name: mo-money-forensics
          path: artifacts/mo_money/analysis.json
          if-no-files-found: error
          retention-days: 7
