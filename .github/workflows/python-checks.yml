name: Python checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile all Python files
        run: python -m compileall -q .
      - name: Run unit tests
        run: python -m pytest -q

  wallet-forensics:
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.event.pull_request.head.ref == 'audit/chainlink-data-and-settlement' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install collector dependency
        run: python -m pip install aiohttp
      - name: Fetch complete public wallet history
        run: python scripts/analyze_target_wallet.py --wallet 0x32ed2e546b187ca15e2841edc82b22c713cf8ec3 --out-dir artifacts/mo_money
      - name: Upload raw data and analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mo-money-wallet-forensics
          path: artifacts/mo_money/
          if-no-files-found: warn
          retention-days: 7
