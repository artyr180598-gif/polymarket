name: Python checks

# Keep only the newest validation for each PR/branch while runners are queued.
concurrency:
  group: python-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          python --version 2>&1 | tee "$RUNNER_TEMP/python-version.log"
          python -m pip install --upgrade pip 2>&1 | tee "$RUNNER_TEMP/pip-upgrade.log"
          pip install -r requirements.txt pytest 2>&1 | tee "$RUNNER_TEMP/pip-install.log"
          pip freeze 2>&1 | tee "$RUNNER_TEMP/pip-freeze.log"
      - name: Compile all Python files
        shell: bash
        run: |
          set -o pipefail
          python -m compileall -q . 2>&1 | tee "$RUNNER_TEMP/compile.log"
      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee "$RUNNER_TEMP/pytest.log"
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-checks-diagnostics-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/python-version.log
            ${{ runner.temp }}/pip-upgrade.log
            ${{ runner.temp }}/pip-install.log
            ${{ runner.temp }}/pip-freeze.log
            ${{ runner.temp }}/compile.log
            ${{ runner.temp }}/pytest.log
          if-no-files-found: ignore
          retention-days: 7

  live-source-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify live Polymarket RTDS, Gamma, CLOB and Data API
        run: python scripts/smoke_polymarket_sources.py
